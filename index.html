<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>ISG Learns — Taking Back At-Home Writing</title>

<!-- THE audience page. Phone or laptop, same URL.
     One scan, one tab, never navigates away. It follows the room:
     when the presenter opens an interaction, this becomes it. -->

<link rel="stylesheet" href="assets/css/tokens.css?v=16">
<link rel="stylesheet" href="assets/css/base.css?v=16">
<script src="config.js?v=16"></script>
</head>
<body>

<div class="app">
  <main class="app-body" id="stage">
    <div class="state-msg"><div class="pill">connecting</div></div>
  </main>
</div>

<script type="module">
import { bus, loadActivity, loadSession } from './assets/js/bus.js';
import { segmentAt } from './assets/js/flow.js';
import { api } from './assets/js/api.js';
import { device } from './assets/js/device.js';
import { h, mount, chrome, offlineBadge } from './assets/js/ui.js';

const stage = document.getElementById('stage');
chrome(document.body);
if (api.OFFLINE) offlineBadge();

const session = await loadSession();
let sig = '', mod = null, modId = null;
let lastSeg = null;

bus.subscribe(async ({ state, cleared }) => {
  /* Reset must reach the phone. The presenter's ↺ sends the room to the
     title card (segment 0); `clear` shrinks the sheet (cleared=true).
     Neither touched device-local answers, so a phone kept showing "You
     said Yes" from an earlier vote and refused to let its owner vote or
     interact again. Forget the saved answers on either signal — once per
     reset (on the transition into segment 0), not every poll, so the
     waiting screen and its name field don't flicker. */
  const resetting = (state.segment === 0 && lastSeg !== 0) || cleared;
  if (resetting) { device.reset(); sig = ''; }
  lastSeg = state.segment;

  const seg = segmentAt(session, state.segment);
  const live = seg && seg.activity && state.phase !== 'idle';

  if (!live) {
    if (sig === 'wait') return;
    sig = 'wait';
    return showWaiting();
  }

  if (modId !== seg.activity) {
    modId = seg.activity; mod = null;
    mount(stage, h('div', { class: 'state-msg' }, h('div', { class: 'pill' }, 'loading')));
    try { mod = await loadActivity(seg.activity); }
    catch {
      sig = 'missing';
      return mount(stage, h('div', { class: 'state-msg' },
        h('p', {}, 'This one is still being built.'),
        h('p', { class: 'faint mono' }, seg.activity)));
    }
  }
  if (!mod) return;

  const s = `${seg.activity}:${state.phase}`;
  if (s === sig) return;
  sig = s;

  const root = h('div', { class: 'fade-in' });
  mount(stage, root);

  mod.phone.render({
    root,
    phase: state.phase,
    session,
    device,
    mine: (slot = 'a') => device.answer(seg.activity, slot),
    submit: (payload, slot = 'a') => api.submit(seg.activity, payload, slot)
  });
});

function showWaiting() {
  mount(stage, h('div', { class: 'state-msg fade-in' },
    h('h2', {}, session.title),
    h('p', { class: 'muted' }, "You're in. Keep this tab open — everything happens here."),
    h('div', { class: 'pill' }, 'waiting for the presenter'),
    nameField()
  ));
}

// Optional name, collected while people wait. Anonymous by default;
// it exists only so a good answer can be called on to elaborate.
function nameField() {
  return h('div', { class: 'card', style: 'width:100%;max-width:22rem;text-align:left' },
    h('div', { class: 'field', style: 'margin:0' },
      h('label', {}, 'Name (optional — so I can call on you)'),
      h('input', {
        class: 'input', type: 'text', placeholder: 'optional', value: device.name,
        onchange: e => { device.name = e.target.value; }
      })));
}

bus.start('audience');
</script>
</body>
</html>
