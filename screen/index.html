<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISG Learns — Screen</title>

<!-- The projector, and the thing your clicker talks to.

     Open fullscreen (⌃⌘F) on the laptop driving the projector.
     A presentation clicker sends arrow / page keys to this page:
       →  ⏎  space  PageDown   forward
       ←  PageUp                back
     Forward is the only control you need. It walks slide beats,
     then opens the interaction, locks it, reveals it, moves on.

     The presenter page on your phone is for out-of-band moves
     (jump to a segment, back to the start) — not required to run. -->

<link rel="stylesheet" href="../assets/css/tokens.css?v=14">
<link rel="stylesheet" href="../assets/css/base.css?v=14">
<script src="../config.js?v=14"></script>
<style>
  body { overflow: hidden; }
  .app-body { min-height: 100dvh; }
  .conn-warn {
    position: fixed; left: var(--s-5); bottom: var(--s-5);
    font-family: var(--font-mono); font-size: var(--t-sm);
    color: var(--accent-hot); opacity: .85;
  }
  /* Bottom-left segment marker — only you will read it from the stage. */
  .segmark {
    position: fixed; left: var(--s-5); top: var(--s-5);
    font-family: var(--font-mono); font-size: var(--t-xs);
    color: var(--ink-faint); opacity: .5;
  }
  /* Blank-screen button on the clicker. */
  body.blacked > *  { visibility: hidden; }
  body.blacked      { background: #000; }
  /* Clicker keys go nowhere if this window isn't focused. Say so. */
  #focushint {
    position: fixed; inset: auto 0 var(--s-7) 0; text-align: center;
    font-size: var(--t-base); color: var(--accent-warm);
    font-family: var(--font-mono); z-index: 70;
  }
</style>
</head>
<body class="screen-root">

<div class="app">
  <main class="app-body" id="stage">
    <div class="state-msg"><div class="pill">screen ready</div></div>
  </main>
</div>
<div class="segmark" id="segmark"></div>
<div id="focushint" hidden>click once on this window — the clicker needs it focused</div>

<!-- Escape hatch, for when you walk to the laptop because something
     has gone wrong. Invisible until the mouse moves. -->
<div class="ctrlbar" id="ctrlbar" data-show="0">
  <button data-act="secback" title="Start of this section — again for the previous one">⏮</button>
  <button data-act="back"    title="Back one beat">‹</button>
  <button data-act="fwd"     title="Forward one beat">›</button>
  <button data-act="secfwd"  title="Start of the next section">⏭</button>
  <span class="ctrlbar__where mono" id="ctrlwhere"></span>
  <button data-act="reset" class="ctrlbar__reset" title="Back to the title card">↺</button>
</div>

<script type="module">
import { bus, loadActivity, loadSession } from '../assets/js/bus.js';
import { api } from '../assets/js/api.js';
import { advance, back, sectionBack, sectionForward, segmentAt } from '../assets/js/flow.js';
import { loadSlide, stepCount, applySteps, placeholder, fillEchoes } from '../assets/js/slides.js';
import { h, mount, chrome, joinBadge, setJoinSize, offlineBadge } from '../assets/js/ui.js';

const stage = document.getElementById('stage');
const session = await loadSession('../');

/* Typed URL in the corner, on every single screen — a standing
   requirement, and the thing that keeps working when the QR is hidden
   on slides. It fades out while the badge is parked bottom-right,
   because the badge shows the same address. */
chrome(document.body);
joinBadge();
if (api.OFFLINE) offlineBadge();

let steps = 0;          // beats in the slide currently on screen
let sig   = '';         // last thing drawn, to avoid needless redraws
let mod   = null;       // loaded activity module
let modId = null;

bus.subscribe(({ state }) => { draw(state); });

async function draw(state) {
  const { segment, step, phase } = state;
  const seg = segmentAt(session, segment);

  document.getElementById('segmark').textContent =
    segment ? `${segment}/${session.segments.length} · ${phase}` : '';
  document.getElementById('ctrlwhere').textContent =
    (seg ? `${segment}/${session.segments.length} · ${seg.title}` : 'title card') +
    `  ·  ${innerWidth}×${innerHeight}`;

  /* Big while the room is arriving; small and out of the way while an
     interaction is open, so a latecomer can scan at the only moment
     it helps them; gone entirely on a slide. */
  /* An open interaction ALWAYS wins. Segment 1 is both the arrival
     slide and the first interaction, and testing "segment <= 1" first
     left the full-size badge sitting on top of the gauge histogram. */
  const interacting = phase !== 'idle' && seg && seg.activity;
  setJoinSize(interacting ? 'small' : segment <= 1 ? 'big' : 'hidden');

  // ---- pre-session title card ----
  if (!seg) {
    if (sig === 'title') return;
    sig = 'title';
    return mount(stage, h('div', { class: 'center fade-in' },
      h('h1', {}, session.title),
      h('p', { class: 'muted', style: 'font-size:var(--t-xl)' }, session.subtitle)));
  }

  // ---- interaction on screen ----
  if (phase !== 'idle' && seg.activity) {
    if (modId !== seg.activity) {
      modId = seg.activity; mod = null;
      try { mod = await loadActivity(seg.activity, '../'); }
      catch {
        sig = 'missing:' + seg.activity;
        return mount(stage, h('div', { class: 'state-msg' },
          h('p', { class: 'faint mono' }, seg.activity + ' — not built yet')));
      }
    }
    if (!mod) return;

    const unique = bus.uniqueFor(seg.activity);
    const rows   = bus.rowsFor(seg.activity);
    const s = `act:${seg.activity}:${phase}:${rows.length}`;
    if (s === sig) return;
    sig = s;

    const root = h('div', { style: 'width:100%' });
    mount(stage, root);
    return mod.screen.render({ root, phase, rows, unique, total: unique.length, session, bus });
  }

  // ---- slide ----
  const s = `slide:${segment}:${step}`;
  if (s === sig) return;
  const sameSlide = sig.startsWith(`slide:${segment}:`);
  sig = s;

  if (!sameSlide) {
    const html = await loadSlide(seg.slide, '../');
    const box = h('div', { class: 'slide fade-in' });
    box.innerHTML = html || placeholder(seg);

    /* A slide file's own root <div class="slide wide"> lands INSIDE
       this wrapper, which is already .slide at max-width 62ch — so the
       inner element cannot widen past a parent that is already narrow.
       Lift the marker up to the wrapper, where it actually does
       something. Full-bleed slides looked mysteriously boxed until
       this; anything wide (the app mocks) needs it. */
    if (box.querySelector(':scope > .wide')) box.classList.add('wide');

    /* Quote the room back at itself, where a slide asks for it. */
    fillEchoes(box, id => bus.rowsFor(id));
    mount(stage, box);
    steps = stepCount(box);

    /* Stepping BACK into an earlier segment lands on step 99 — a
       sentinel for "however many beats that slide turns out to have",
       because flow.js can't know until the slide is in the DOM.

       It has to be normalised HERE, in the state, not just clamped at
       render time. Left at 99, pressing back would walk 99 → 98 → 97
       and you would have to press about a hundred times to get through
       one slide's beats. Now that we know the real count, write it. */
    if (step > steps) {
      bus.setState({ segment, step: steps, phase });
      return;
    }
  }
  const box = stage.firstElementChild;
  if (box) applySteps(box, Math.min(step, steps));
}

/* ---------- the forward button ------------------------------
   Logitech presenters (R400, R500, Spotlight) send:
     Next        → PageDown / Right Arrow
     Previous    → PageUp   / Left Arrow
     Blank       → b or .        (handled: blacks the screen)
     Start/Stop  → F5 / Escape   (F5 is swallowed — see below)
   ------------------------------------------------------------ */

const FWD  = ['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'];
const BACK = ['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'];

let moving = false;

addEventListener('keydown', e => {

  /* The clicker's "start presentation" button sends F5, which would
     RELOAD this page mid-session. Swallow it. (Even if it got through
     we'd recover — the running order lives in the sheet, not in this
     tab — but a two-second white flash on the projector is bad.) */
  if (e.key === 'F5') { e.preventDefault(); return; }

  /* Blank-screen button. Same key PowerPoint uses. */
  if (e.key === 'b' || e.key === 'B' || e.key === '.') {
    e.preventDefault();
    document.body.classList.toggle('blacked');
    return;
  }

  const fwd = FWD.includes(e.key), bak = BACK.includes(e.key);
  if (!fwd && !bak) return;
  e.preventDefault();
  if (document.body.classList.contains('blacked')) return;  // frozen while blank
  if (moving) return;                  // clickers double-fire; ignore the echo
  /* This guard exists ONLY to swallow the duplicate keydown a physical
     clicker fires within a few milliseconds. It must therefore be a
     fixed, short debounce — released on a timer started right now, NOT
     after the sheet write returns.

     Tying it to the write was wrong: with a ~600ms endpoint it meant
     you could only advance about once a second, and pressing faster
     than that silently ate presses. Which is the other half of why it
     felt laggy.

     So: redraw optimistically, release the guard on its own clock, and
     let the write finish in the background. A failed write rolls the
     state back inside bus.setState and the "lost the sheet" warning
     explains it. */
  moving = true;
  setTimeout(() => { moving = false; }, 180);

  const next = (fwd ? advance : back)(session, bus.state, steps);
  bus.setState(next).catch(err => console.warn('[isg] could not advance', err));
});

/* ---------- on-screen controls ------------------------------
   Only ever seen by whoever is standing at the laptop. Shown on mouse
   movement, hidden 2.5s after it stops — a clicker sends keys, not
   mouse events, so running the session normally never summons it.

   Every button stops the click from bubbling. Without that, the
   click-anywhere-to-advance handler on window would fire too and every
   press would do its own job AND jump a beat forward. */

const ctrlbar = document.getElementById('ctrlbar');
let hideBar;

function showBar() {
  ctrlbar.dataset.show = '1';
  clearTimeout(hideBar);
  hideBar = setTimeout(() => { ctrlbar.dataset.show = '0'; }, 2500);
}
addEventListener('mousemove', showBar);

/* The viewport size is in the bar's label. It is the only number that
   decides how this lays out — not the iBoard's panel resolution — and
   it changes with mirror vs extend, display scaling, and fullscreen.
   Redraw the label when it changes so you can just read it off. */
addEventListener('resize', () => { sig = ''; draw(bus.state); showBar(); });

ctrlbar.addEventListener('click', async e => {
  e.stopPropagation();
  const act = e.target.closest('button')?.dataset.act;
  if (!act) return;

  if (act === 'fwd' || act === 'back') {
    return dispatchEvent(new KeyboardEvent('keydown',
      { key: act === 'fwd' ? 'ArrowRight' : 'ArrowLeft' }));
  }
  if (act === 'reset') {
    if (!confirm('Back to the title card?')) return;
    return bus.setState({ segment: 0, step: 0, phase: 'idle' })
      .catch(err => console.warn('[isg] reset failed', err));
  }
  const next = (act === 'secback' ? sectionBack : sectionForward)(session, bus.state);
  bus.setState(next).catch(err => console.warn('[isg] section jump failed', err));
});

/* ---------- focus ------------------------------------------
   A clicker is just a keyboard. Keys go nowhere unless this
   window has focus — the single most likely way to look broken
   in front of a room. So: say so on screen when focus is lost,
   and make the click that restores focus NOT also advance. */

let refocusedAt = 0;
addEventListener('blur',  () => { refocusedAt = 0; showFocusHint(true); });
addEventListener('focus', () => { refocusedAt = Date.now(); showFocusHint(false); });

addEventListener('click', e => {
  if (Date.now() - refocusedAt < 400) return;   // that click was just for focus
  if (document.body.classList.contains('blacked')) return;

  /* Dead strip along the bottom. The control bar lives there, and on a
     touchscreen you have to touch the screen to summon it — without
     this, that first touch would also jump a beat forward. Nothing in
     the bottom 120px ever advances. */
  if (e.clientY > innerHeight - 120) { showBar(); return; }

  dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight' }));
});

function showFocusHint(on) {
  document.getElementById('focushint').hidden = !on;
}

/* Backstop: blur/focus events aren't fired identically by every OS and
   browser combination, and being wrong about this on the day is
   expensive. Poll the real answer too. */
setInterval(() => showFocusHint(!document.hasFocus()), 1000);
showFocusHint(!document.hasFocus());

bus.start('screen');

setInterval(() => {
  document.querySelector('.conn-warn')?.remove();
  if (!bus.connected && !api.OFFLINE) {
    document.body.append(h('div', { class: 'conn-warn' }, '⚠ lost the sheet — using what we have'));
  }
}, 3000);
</script>
</body>
</html>
